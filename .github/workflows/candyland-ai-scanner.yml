name: Candyland AI Scanner Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/candyland-ai-scanner.yml"

permissions:
  contents: read

concurrency:
  group: candyland-ai-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  groundingdino_scan:
    name: "GroundingDINO → crops → Blender 3D pack"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Install real CPU vision stack
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet transformers safetensors accelerate pillow opencv-python-headless numpy
          python3 - <<'PY'
          import torch
          print("TORCH", torch.__version__, "CUDA", torch.cuda.is_available())
          PY

      - name: Run GroundingDINO scanner
        env:
          CANDY_USE_AI_DETECTOR: "1"
          CANDY_GROUNDING_DINO_MODEL: "IDEA-Research/grounding-dino-tiny"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          mkdir -p candyland/ai-scan
          python3 maps/candyland_dream/scanner/scan_reference.py \
            --reference-b64 maps/candyland_dream/scanner/references/approved_overview.jpg.b64 \
            --seed maps/candyland_dream/scanner/reference_seed_inventory.json \
            --out candyland/ai-scan \
            --min-score 0.12
          python3 - <<'PY'
          import json
          r=json.load(open("candyland/ai-scan/detections.json"))
          print("DETECTION_BACKEND",r["detection_backend"])
          print("MODEL",r["model_id"])
          print("DETECTIONS",len(r["detections"]))
          print("ERRORS",r["errors"])
          # This workflow is specifically for real model validation.
          if r["detection_backend"] != "groundingdino":
              raise SystemExit("GroundingDINO did not produce >=3 usable detections")
          PY

      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb libegl1 libgl1-mesa-dri libglx-mesa0

      - name: Turn detections into a Blender 3D pack
        env:
          CANDY_SCANNER_QUEUE: candyland/ai-scan/asset_queue.json
          CANDY_SCANNER_3D_OUT: candyland/ai-scan-3d
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" blender --background \
            --python maps/candyland_dream/blender/scanner_asset_factory.py \
            2>&1 | tee candyland/ai-scan-3d.log
          test -s candyland/ai-scan-3d/candy_scanner_assets.glb
          test -s candyland/ai-scan-3d/scanner_asset_preview.png

      - uses: actions/upload-artifact@v4
        with:
          name: candyland-groundingdino-ai-scan
          path: |
            candyland/ai-scan/
            candyland/ai-scan-3d/
            candyland/ai-scan-3d.log
          if-no-files-found: error
          retention-days: 14
