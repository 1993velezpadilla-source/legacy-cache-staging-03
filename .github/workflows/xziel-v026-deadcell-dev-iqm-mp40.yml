name: XZIEL v026 Dead Cell Developer Real MP40 APK
on:
  pull_request:
    paths:
      - '.github/workflows/xziel-v026-deadcell-dev-iqm-mp40.yml'
      - 'tools/quake_gltf/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-iqm-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      XZIEL_IQM_TOOLS: ${{ github.workspace }}/tools/quake_gltf
      XZIEL_DEV_MENU_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK and NDK 27
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install FTEQW converter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libjpeg-dev
      - name: Build FTEQW full iqmtool (supports GLB)
        run: |
          git clone -q https://github.com/fte-team/fteqw.git --depth=1 --filter=blob:none fteqw
          cd fteqw
          git fetch --depth=1 origin f937b9d88f71fc4429db5fe56c6a98d922711b2e
          git checkout --detach f937b9d88f71fc4429db5fe56c6a98d922711b2e
          cd ..
          cmake -S fteqw -B fte-build -DCMAKE_BUILD_TYPE=Release -DFTE_TOOL_IQM=ON \
            -DFTE_ENGINE=OFF -DFTE_ENGINE_CLIENT_ONLY=OFF -DFTE_ENGINE_SERVER_ONLY=OFF \
            -DFTE_CSADDON=OFF -DFTE_MENU_SYS=OFF \
            -DFTE_PLUG_BULLET=OFF -DFTE_PLUG_CEF=OFF -DFTE_PLUG_EZHUD=OFF -DFTE_PLUG_FFMPEG=OFF \
            -DFTE_PLUG_HL2=OFF -DFTE_PLUG_IRC=OFF -DFTE_PLUG_MPQ=OFF -DFTE_PLUG_NAMEMAKER=OFF \
            -DFTE_PLUG_ODE=OFF -DFTE_PLUG_OPENSSL=OFF -DFTE_PLUG_OPENXR=OFF -DFTE_PLUG_QI=OFF \
            -DFTE_PLUG_QUAKE3=OFF -DFTE_PLUG_TERRAINGEN=OFF -DFTE_PLUG_TIMIDITY=OFF \
            -DFTE_PLUG_X11SV=OFF -DFTE_PLUG_XMPP=OFF -DFTE_PLUG_MODELS=OFF \
            -DFTE_TOOL_HTTPSV=OFF -DFTE_TOOL_IMAGE=OFF -DFTE_TOOL_MASTER=OFF -DFTE_TOOL_QCC=OFF \
            -DFTE_TOOL_QCCGUI=OFF -DFTE_TOOL_QTV=OFF
          cmake --build fte-build --target iqmtool -j 2
          test -x fte-build/iqmtool
      - name: Fetch actual licensed high-fidelity MP40 model (not a placeholder)
        run: |
          mkdir -p work
          curl --fail --location --retry 6 --retry-delay 3 --retry-all-errors \
            -o work/MP40-Moony_State.glb \
            'https://zenodo.org/records/10379721/files/7ec7e1f9656e4319b8edae0d785699ad.glb?download=1'
          echo '733d3ce5428a6451ec5231fa18e84058  work/MP40-Moony_State.glb' | md5sum --check
          python3 tools/quake_gltf/preflight.py work/MP40-Moony_State.glb | tee work/MP40.source.json
      - name: Convert actual MP40 GLB to IQM and stage original albedo in APK overlay
        run: |
          set -euo pipefail
          ./fte-build/iqmtool work/MP40-Real.iqm work/MP40-Moony_State.glb
          python3 tools/quake_gltf/inspect_iqm.py work/MP40-Real.iqm --source-glb work/MP40-Moony_State.glb | tee work/MP40.parity.json
          python3 tools/quake_gltf/stage_real_mp40.py work/MP40-Moony_State.glb work/MP40-Real.iqm dead-cell-overlay | tee work/MP40.stage.json
          test -s dead-cell-overlay/models/weapons/mp40/v_mp40.iqm
          test -s dead-cell-overlay/models/weapons/mp40/v_mp40.iqmparts
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('dead-cell-overlay/models/weapons/mp40/v_mp40.iqmparts')
          b=p.read_bytes()
          assert b[:8]==b'XIQMPART'
          assert struct.unpack_from('<I',b,8)[0]==14450
          assert sum(x.bit_count() for x in b[12:])==894
          print('SAME_HIGH_POLY_MP40_MAGAZINE_MASK_GREEN 894 source triangles')
          PY
          test -s dead-cell-overlay/licenses/MP40-MoonyState-CC-BY-4.0.txt
      - name: C99 regression gate on ACTUAL unanimated 14,450-face MP40 IQM
        run: |
          set -euo pipefail
          cc -std=c99 -Wall -Wextra -Werror -O2 -o work/test_iqm_skeleton tools/quake_gltf/test_iqm_animation.c -lm
          work/test_iqm_skeleton work/MP40-Real.iqm | tee work/MP40.iqm-decoder.log
          grep -q 'IQM_ANIMATION_DECODER_GREEN' work/MP40.iqm-decoder.log
      - name: Checkout PINNED working v0.26 Dead Cell ONLY Developer builder (not old main)
        run: |
          git clone --filter=blob:none https://github.com/1993velezpadilla-source/config-old-3.git xziel-builder
          git -C xziel-builder checkout 3e7d4d8cd46da439c08db1127fee204dea84d1ef
          grep -q 'patch_vril_official_touch_skins_v026.py' xziel-builder/scripts/prepare_android.sh
          grep -q 'patch_xziel_v026_devmenu.py' xziel-builder/scripts/prepare_android.sh
      - name: Restore original compact 4-spawn Dead Cell CORE
        shell: bash
        run: |
          set -euo pipefail
          cd xziel-builder
          python3 tools/zombie_prototype/generate_graybox_map.py
          test -s build/prototype/xziel_proto.map
          cat build/prototype/xziel_proto_report.json

      - name: Compile map and spawn zones with NZP tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nzp-assets /tmp/spawn-zone-tool
          git clone --depth 1 https://github.com/nzp-team/assets.git /tmp/nzp-assets
          git clone --depth 1 --recursive https://github.com/nzp-team/spawn-zone-tool.git /tmp/spawn-zone-tool
          python3 -m pip install --quiet -r /tmp/spawn-zone-tool/requirements.txt

          (
            cd /tmp/nzp-assets
            bash tools/compile-wads.sh
            mkdir -p source/maps/xziel_proto
            cp "$GITHUB_WORKSPACE/xziel-builder/build/prototype/xziel_proto.map" source/maps/xziel_proto/xziel_proto.map
            bash tools/compile-maps.sh --map xziel_proto --zone-tool-path /tmp/spawn-zone-tool
          ) 2>&1 | tee /tmp/xziel-proto-map-compile.log

          mkdir -p proto-dist
          cp /tmp/nzp-assets/common/maps/xziel_proto.bsp proto-dist/
          test -s /tmp/nzp-assets/common/maps/xziel_proto.nsz
          cp /tmp/nzp-assets/common/maps/xziel_proto.nsz proto-dist/
          cp xziel-builder/build/prototype/xziel_proto.map proto-dist/
          cp xziel-builder/build/prototype/xziel_proto_report.json proto-dist/
          cp /tmp/xziel-proto-map-compile.log proto-dist/
          ls -lh proto-dist/

      - name: Extract original 46-pose NZP hands ONLY from the authentic Blender source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y -qq blender python3-numpy libegl1 libgl1
          SRC=/tmp/nzp-assets/source/models/weapons/mp40/v_mp40/mesh.blend
          STOCK=/tmp/nzp-assets/common/models/weapons/mp40/v_mp40.mdl
          test -s "$SRC" && test -s "$STOCK"
          git -C xziel-builder fetch --depth 1 origin cbbf5669f2e9feb0f763dd21b6069347fe9fde4f
          git -C xziel-builder show cbbf5669f2e9feb0f763dd21b6069347fe9fde4f:tools/mp40_bridge/blender_stock_model_icp.py > work/measure_original_mp40.py
          blender -b "$SRC" --python work/measure_original_mp40.py -- "$STOCK" \
            work/mp40-source-registration.json > work/hands-fit.log 2>&1 || { tail -n 60 work/hands-fit.log; exit 1; }
          mkdir -p dead-cell-overlay/models/weapons/mp40
          blender -b "$SRC" --python tools/quake_gltf/blender_split_original_mp40_hands.py -- \
            "$STOCK" work/mp40-source-registration.json \
            dead-cell-overlay/models/weapons/mp40/v_mp40_hands_only.mdl \
            work/mp40-authentic-hands.json \
            dead-cell-overlay/models/weapons/mp40/v_mp40.iqmpose > work/hands-split.log 2>&1 || { tail -n 80 work/hands-split.log; exit 1; }
          grep -q MP40_AUTHENTIC_SOURCE_HANDS_46_FRAME_SPLIT_GREEN work/hands-split.log
          grep -q MP40_STOCK_GUN_RIGID_POSE_46_FRAME_GREEN work/hands-split.log
          test -s dead-cell-overlay/models/weapons/mp40/v_mp40.iqmpose
          test -s dead-cell-overlay/models/weapons/mp40/v_mp40_hands_only.mdl
          python3 - <<'PY'
          import json
          p=json.load(open("work/mp40-authentic-hands.json"))
          assert p["source_animated_frames"]==46 and p["hands_polygons"]>120
          assert p["removed_legacy_gun_polygons"]>200
          assert p["all_46_source_pose_bytes_preserved"]
          assert p["skins_and_vertex_uvs_unchanged"]
          assert p["modern_weapon_follows_original_stock_gun_pose"]
          assert p["stock_gun_pose_max_rotation_degrees"]>25.0
          assert p["stock_gun_pose_worst_90pct_rigid_error"]<3.0
          print("NZP_REAL_46_FRAME_HANDS_READY_FOR_MODERN_IQM_OVERLAY")
          PY

      - name: Add Dead Cell custom-map display name only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dead-cell-overlay/maps
          python3 - <<'PY'
          from pathlib import Path
          rows=["XZIEL: DEAD CELL", "ORIGINAL FAST-SPAWN CORE ARENA",
                "4 INSIDE ZOMBIE SPAWNS", "NO WAITING ON WINDOWS",
                "SOLO ZOMBIES TEST", "DEVELOPER MENU SUPPORTED",
                "", "", "", "XZIEL", "0", "1"]
          assert len(rows)==12
          Path("dead-cell-overlay/maps/xziel_proto.txt").write_text("\n".join(rows)+"\n")
          PY

      - name: Inject optional Vril IQM patch before the native compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("xziel-builder/scripts/prepare_android.sh")
          text=p.read_text()
          anchor='python3 "$ROOT/scripts/patch_vril_official_touch_skins_v026.py" "$DEPS/vril"'
          assert text.count(anchor)==1, 'Unsupported XZIEL builder revision'
          text=text.replace(anchor,anchor+'\npython3 "$XZIEL_IQM_TOOLS/patch_vril_iqm.py" "$DEPS/vril"'
                                   +'\npython3 "$XZIEL_IQM_TOOLS/enable_mp40_preview_vril.py" "$DEPS/vril" --hands-only')
          qa='python3 "$ROOT/scripts/patch_xziel_v026_devmenu.py" "$DEPS"\nfi'
          assert text.count(qa)==1, 'Cannot locate post-v026 developer menu QuakeC patch position'
          text=text.replace(qa, qa+'\npython3 "$XZIEL_IQM_TOOLS/patch_mp40_smoke_quakec.py" "$DEPS/quakec"')
          asset_copy='cp -a "$XZIEL_EXTRA_ASSET_DIR"/. "$ASSET_WORK/nzp/"'
          assert text.count(asset_copy)==1, 'Missing asset overlay integration in builder'
          text=text.replace(asset_copy,asset_copy+
             '\npython3 "$XZIEL_IQM_TOOLS/fit_iqm_mdl.py" '
             '"$ASSET_WORK/nzp/models/weapons/mp40/v_mp40.mdl" '
             '"$ASSET_WORK/nzp/models/weapons/mp40/v_mp40.iqm" '
             '"$ASSET_WORK/nzp/models/weapons/mp40/v_mp40.iqmfit" '
             '"$DEPS/quakec/source/shared/weapon_stats.qc" W_MP40 '
             '--hands-only "$ASSET_WORK/nzp/models/weapons/mp40/v_mp40_hands_only.mdl"')
          p.write_text(text)
          PY
      - name: Assemble ORIGINAL v0.26 Dead Cell Developer + actual high-poly MP40
        env:
          XZIEL_EXTRA_ASSET_DIR: ${{ github.workspace }}/dead-cell-overlay
          XZIEL_EXTRA_MAP_NAME: xziel_proto
          XZIEL_EXTRA_MAP_BSP: ${{ github.workspace }}/proto-dist/xziel_proto.bsp
          XZIEL_EXTRA_MAP_NSZ: ${{ github.workspace }}/proto-dist/xziel_proto.nsz
        shell: bash
        run: |
          set -euo pipefail
          cd xziel-builder
          bash scripts/prepare_android.sh
          python3 scripts/slim_v026_deadcell_only.py build
          grep -q 'W_MP40, 32, 192' build/deps/quakec/source/server/player/player_core.qc
          grep -q '"xziel_iqm_viewmodels", "1"' build/deps/vril/source/platform/sdl/gl/gl_xziel_iqm_viewmodel.c
          grep -q 'XZIEL DEVELOPER' build/deps/vril/source/menu/menu_pause.c
          grep -q 'XZIEL WEAPON LAB' build/deps/vril/source/menu/menu_pause.c
          grep -q 'XzielDev_DispatchPendingImpulse();' build/deps/vril/source/render/r_hud.c
          grep -q 'SELECT MAP: SOLO' build/deps/vril/source/menu/menu_stockmaps.c
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          app=Path("build/android-project/app")
          with ZipFile(app/"src/main/assets/nzp-data.zip") as z:
              names=set(z.namelist())
              maps=sorted(n for n in names if n.startswith("nzp/maps/") and n.endswith(".bsp"))
              assert maps==["nzp/maps/xziel_proto.bsp"],maps
              assert "nzp/models/weapons/mp40/v_mp40.iqm" in names
              import json, hashlib, struct
              hands=z.read("nzp/models/weapons/mp40/v_mp40_hands_only.mdl")
              source_mdl=z.read("nzp/models/weapons/mp40/v_mp40.mdl")
              hr=json.load(open("../work/mp40-authentic-hands.json"))
              assert hashlib.sha256(source_mdl).hexdigest()==hr["input_sha256"], "Hands source differs from v0.26 actual stock MDL"
              assert hands[:4]==b'IDPO' and len(hands)>84
              assert struct.unpack_from('<I',hands,64)[0]==hr["hands_polygons"]
              assert struct.unpack_from('<I',hands,68)[0]==46
              assert hr["removed_legacy_gun_polygons"]>200
              # Reject APKs that install the moving original hands but
              # leave the replacement gun frozen at a guessed pose.
              pose=z.read("nzp/models/weapons/mp40/v_mp40.iqmpose")
              assert pose[:8]==b"XIQMPOSE" and len(pose)==12+46*64
              assert struct.unpack_from("<I",pose,8)[0]==46
              assert hr["stock_gun_pose_max_rotation_degrees"]>25
              print("APKBUNDLE_ORIGINAL_ANIMATED_HANDS_WITHOUT_OLD_GUN_GREEN")
              mask=z.read("nzp/models/weapons/mp40/v_mp40.iqmparts")
              assert mask[:8]==b'XIQMPART'
              assert sum(x.bit_count() for x in mask[12:])==894
              assert "nzp/models/weapons/mp40/v_mp40.iqmfit" in names
              metadata=z.read("nzp/models/weapons/mp40/v_mp40.iqmfit").decode().split()
              assert len(metadata)==12,metadata
              # Source v0.26 GetWeaponADSOfs W_MP40:
              # [-11400,6500,-1000]/1000 => e.origin[1]=+11.4, z=+6.5
              assert abs(float(metadata[4])-11.4)<0.001,metadata
              # The old unfiltered stock MDL frame includes a 7.06 Quake
              # lateral-unit span of displaced reload hands, causing the
              # replacement gun to hover separately (visible on real phone).
              # The actual original MP40 gun's Y centroid is ~ -11.47.
              import numpy as np
              from io import BytesIO
              modelbytes=z.read("nzp/models/weapons/mp40/v_mp40.iqm")
              vcount=struct.unpack_from("<I",modelbytes,48)[0]
              desc_count=struct.unpack_from("<I",modelbytes,44)[0]
              desc_start=struct.unpack_from("<I",modelbytes,52)[0]
              gun_y=None
              for t in range(desc_count):
                  kind,flags,fmt,width,ofs=struct.unpack_from("<5I",modelbytes,desc_start+t*20)
                  if kind==0 and fmt==7 and width==3:
                      gun_y=np.frombuffer(modelbytes,dtype="<f4",count=vcount*3,
                                          offset=ofs).reshape((-1,3))[:,1]
              assert gun_y is not None
              fit_scale=float(metadata[0]);fit_y=float(metadata[2])
              actual_mid=fit_y+fit_scale*(float(gun_y.min())+float(gun_y.max()))/2
              # These source constraints are from the ORIGINAL source MDL
              # metal vertices, not a guessed artist placement.
              assert -13.0<actual_mid<-10.0,(actual_mid,fit_y)
              print("MP40_GUN_ONLY_LATERAL_ALIGNMENT_GREEN",actual_mid)

              assert abs(float(metadata[5]))>1.0 and abs(float(metadata[6]))>0.1,metadata
              assert [int(float(x)) for x in metadata[7:9]]==[4,31],metadata
              assert 0.50 < float(metadata[9]) < 0.59,metadata
              assert abs(float(metadata[10]))<0.03,metadata
              assert 0.12 < float(metadata[11]) < 0.15,metadata
              print("ORIGINAL_QUAKEC_MP40_ADS_RELOAD_FRONT_IRON_SIGHT_GREEN",metadata[4:])
              assert "nzp/licenses/MP40-MoonyState-CC-BY-4.0.txt" in names
              controls={"fire":"fire","aim":"ads","aim_fire":"adsfire",
                "crouch":"crouch","prone":"prone","slide":"slide",
                "reload":"reload","knife":"knife","interact":"use",
                "grenade":"grenade","weapon_swap":"switch","vault_jump":"jump"}
              for source,dest in controls.items():
                raw=Path(f"assets/xziel/official_touch_skins_v1/{source}.png").read_bytes()
                assert z.read(f"nzp/gfx/xziel/{dest}.png")==raw,(source,dest)
              print("V026_DEADCELL_DEV_IQM_ASSETS_GREEN all 12 original touch skins, one BSP")
          PY
          python3 - <<'PY'
          from pathlib import Path
          app=Path("build/android-project/app")
          gradle=app/"build.gradle"
          s=gradle.read_text()
          anchor='applicationId "com.xziel.nzp"'
          assert s.count(anchor)==1, "Unexpected v0.26 Android application ID"
          gradle.write_text(s.replace(anchor,'applicationId "com.xziel.deadcell.iqmdev"',1))
          strings=app/"src/main/res/values/strings.xml"
          s=strings.read_text()
          anchor='<string name="app_name">Xziel: NZP Native</string>'
          assert s.count(anchor)==1
          strings.write_text(s.replace(anchor,'<string name="app_name">XZIEL Dead Cell DEV IQM</string>',1))
          PY
          cd build/android-project
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Validate generated APK
        run: |
          mkdir -p dist
          APK=xziel-builder/build/android-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" dist/XZIEL-v026-DeadCell-DEV-MP40-IQM.apk
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          sha256sum dist/XZIEL-v026-DeadCell-DEV-MP40-IQM.apk | tee dist/sha256.txt
      - name: Upload real MP40 experimental APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-v026-DeadCell-DEV-MP40-IQM-APK
          path: dist/
          if-no-files-found: warn
          retention-days: 7

  android-iqm-emulator-smoke:
    needs: android-iqm-debug
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XZIEL-v026-DeadCell-DEV-MP40-IQM-APK
          path: dist
      - name: Install x86_64 emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Start emulator, install APK, verify first frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" dist
          ADB="$ANDROID_HOME/platform-tools/adb"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort -V | tail -n 1)"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name xziel-iqm-smoke \
            --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$ANDROID_HOME/emulator/emulator" @xziel-iqm-smoke \
            -no-window -no-snapshot -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -memory 2048 > dist/emulator.log 2>&1 &
          timeout 180 "$ADB" wait-for-device
          BOOTED=0
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then BOOTED=1; break; fi
            sleep 2
          done
          test "$BOOTED" = 1
          "$ADB" install -r dist/XZIEL-v026-DeadCell-DEV-MP40-IQM.apk
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true
          "$ADB" logcat -c
          "$ADB" shell am start -W -n com.xziel.deadcell.iqmdev/org.libsdl.app.NZPActivity \
            --es xziel_ci_map xziel_proto | tee dist/launch.txt
          # Source-equivalent ADS and reload are tested with the EXACT APK
          # built in this workflow (no stale artifact from an earlier run).
          READY_MODEL=0
          for t in $(seq 1 48); do
            if "$ADB" logcat -d -s XZIEL_IQM:I '*:S' 2>/dev/null | \
              grep -q 'DRAWN model=models/weapons/mp40/v_mp40.mdl triangles=14450'; then
              READY_MODEL=1; break
            fi
            sleep 1
          done
          test "$READY_MODEL" = 1
          "$ADB" exec-out screencap -p > dist/00-deadcell-MP40-modern-idle.png
          # Fire to create empty magazine space, tap original v0.26 reload.
          "$ADB" shell input swipe 2124 632 2124 632 500
          "$ADB" shell input tap 1932 848
          sleep 0.28
          "$ADB" exec-out screencap -p > dist/01-MP40-modern-magazine-extraction.png
          sleep 0.65
          "$ADB" exec-out screencap -p > dist/02-MP40-modern-magazine-reinsert.png
          "$ADB" logcat -d -v threadtime > dist/modern-reload-logcat.txt
          if ! grep -q 'XZIEL_IQM.*MODERN_MAGAZINE_COMPONENT.*faces=894' dist/modern-reload-logcat.txt; then
            echo 'FAILED: full 894-face modern IQM magazine is NOT active'
            exit 1
          fi
          if ! grep -q 'XZIEL_IQM.*RELOAD_SAME_HIGH_POLY_IQM.*movable_magazine_faces=894' dist/modern-reload-logcat.txt; then
            echo 'FAILED: original QuakeC reload did NOT animate the same IQM weapon'
            exit 1
          fi
          if ! grep -q 'XZIEL_IQM.*ORIGINAL_GUN_POSE_46_SOURCE_FRAMES_LOADED' dist/modern-reload-logcat.txt; then
            echo 'MP40_GUN_POSE_SIDECAR_NOT_LOADED'; exit 1
          fi
          if ! grep -q 'XZIEL_IQM.*MODERN_MP40_STOCK_RELOAD_POSE_FOLLOW' dist/modern-reload-logcat.txt; then
            echo 'MP40_MODERN_GUN_NOT_FOLLOWING_ORIGINAL_RELOAD_POSE'; exit 1
          fi
          if ! grep -q 'XZIEL_IQM.*ORIGINAL_HANDS_SAME_46_POSE model=models/weapons/mp40/v_mp40_hands_only.mdl' dist/modern-reload-logcat.txt; then
            echo 'FAILED: original 46-pose hands overlay not drawn with modern 14,450-face MP40'
            exit 1
          fi
          if ! grep -q 'XZIEL_IQM.*ORIGINAL_HANDS_RELOAD_FRAMES_ADVANCE model=models/weapons/mp40/v_mp40_hands_only.mdl' dist/modern-reload-logcat.txt; then
            echo 'AUTHENTIC_HANDS_FRAME_ADVANCE_NOT_OBSERVED: still RED'
            exit 1
          fi
          echo '===== LIVE ADS / HANDS / MAGAZINE OPTICAL DIAGNOSTIC ====='
          grep -E 'XZIEL_IQM.*(ADS_ORIGIN|OPTICAL_|ORIGINAL_HANDS|MAGAZINE_REAL|RELOAD_SAME)' dist/modern-reload-logcat.txt | tail -n 80 || true
          if grep -q 'RELOAD_LEGACY_ANIMATED_FALLBACK' dist/modern-reload-logcat.txt; then
            echo 'FAILED: obsolete old-MDL reload renderer still active'
            exit 1
          fi
          if ! grep -q 'XZIEL_IQM.*MAGAZINE_REAL_VERTEX_TRANSLATION model=models/weapons/mp40/v_mp40.mdl faces=894 vertices=2682' dist/modern-reload-logcat.txt; then
            echo 'FAILED: reload started but no proof all 894 magazine triangles moved in the actual render buffer'
            exit 1
          fi
          echo 'XZIEL_V026_SAME_MODERN_MP40_RELOAD_NO_MDL_SWAP_GREEN'
          sleep 12
          "$ADB" exec-out screencap -p > dist/android-first-frame.png
          "$ADB" logcat -d -v threadtime > dist/logcat.txt
          "$ADB" shell run-as com.xziel.deadcell.iqmdev cat files/nzp-runtime/.xziel-stage \
            > dist/stage.txt 2>/dev/null || true
          "$ADB" shell run-as com.xziel.deadcell.iqmdev cat files/nzp-runtime/.xziel-last-error \
            > dist/last-error.txt 2>/dev/null || true
          echo "===== FIRST FRAME STATE ====="
          cat dist/stage.txt
          PID="$("$ADB" shell pidof com.xziel.deadcell.iqmdev 2>/dev/null | tr -d '\r' || true)"
          test -n "$PID"
          grep -q FIRST_FRAME_OK dist/stage.txt

          echo '===== ACTUAL IQM MODEL RUNTIME EVENTS ====='
          grep -E 'XZIEL_IQM|mp40' dist/logcat.txt | tail -n 40 || true
          if ! grep -E 'XZIEL_IQM.*LOADED models/weapons/mp40/v_mp40.iqm' dist/logcat.txt; then
            echo 'FAILED: MP40 high-poly IQM was bundled but NOT proven loaded/rendered; no green claim'
            exit 1
          fi
          if ! grep -Eq 'XZIEL_IQM.*DRAWN model=models/weapons/mp40/v_mp40.mdl triangles=14450 textured_batches=[1-9]' dist/logcat.txt; then
            echo 'FAILED: IQM render did not draw textured real MP40 geometry'
            exit 1
          fi
          # Android system image sometimes crashes Google Wallpaper in a separate process.
          # Reject crashes ONLY from our app, not unrelated emulator background services.
          if grep -Eq 'AndroidRuntime: Process: com.xziel.deadcell.iqmdev([, ]|$)|>>> com.xziel.deadcell.iqmdev <<<|stage=SYS_ERROR' dist/logcat.txt; then
            echo "XZIEL Android app-specific crash marker detected"
            exit 1
          fi
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path('dist/android-first-frame.png')
          data=p.read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n', 'No PNG screenshot'
          width,height=struct.unpack_from('>II',data,16)
          assert width>=800 and height>=480, (width,height)
          print('ANDROID_V026_DEADCELL_DEV_IQM_RENDER_GREEN',width,height)
          PY
      - name: Upload Android MP40 render and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XZIEL-v026-DeadCell-DEV-MP40-RENDER
          path: dist/
          if-no-files-found: warn
          retention-days: 14
