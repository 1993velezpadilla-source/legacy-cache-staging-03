name: Quake GLB Preflight Tests
on:
  pull_request:
    paths:
      - 'tools/quake_gltf/**'
      - '.github/workflows/quake-gltf-preflight.yml'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GLB structural preflight unit tests
        run: cd tools/quake_gltf && python3 -m unittest -v
