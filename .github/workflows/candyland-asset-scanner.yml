name: CandyAssetScanner v0.7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/candyland-asset-scanner.yml"
      - "maps/candyland_dream/scanner/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: candyland-asset-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: "Scanner — detect, segment, proxy-3D, Blender ingest"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - name: Locate latest successful Candyland world artifact
        id: world
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow "Candyland Dream Seven-Agent Production Pipeline" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          mkdir -p scanner_input/world
          gh run download "$RUN_ID" -n candyland-agent1-world -D scanner_input/world
          find scanner_input/world -maxdepth 2 -type f -print

      - name: Select beauty references for scanning
        run: |
          set -euo pipefail
          mkdir -p scanner_input/images
          for f in candyland_iso.png candyland_spawn_view.png candyland_castle_view.png candyland_plaza_view.png candyland_forest_view.png candyland_river_view.png candyland_gloss_closeup.png; do
            if [[ -s "scanner_input/world/$f" ]]; then cp "scanner_input/world/$f" "scanner_input/images/$f"; fi
          done
          test "$(find scanner_input/images -type f | wc -l)" -ge 3

      - name: Install scanner runtime
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet             "transformers>=4.46,<5" accelerate safetensors             opencv-python-headless pillow numpy trimesh scipy shapely
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb libegl1 libgl1-mesa-dri libglx-mesa0

      - name: Detect items and create 3D proxies
        env:
          CANDY_DEVICE: cpu
          CANDY_BOX_THRESHOLD: "0.28"
          CANDY_TEXT_THRESHOLD: "0.20"
        run: |
          set -euo pipefail
          python3 maps/candyland_dream/scanner/detect_and_proxy.py scanner_input/images scanner_output --max-items 18
          test -s scanner_output/scanner_manifest.json
          test -s scanner_output/quality_queue.json
          python3 - <<'PY'
          import json, pathlib
          m=json.load(open("scanner_output/scanner_manifest.json"))
          assert m["status"]=="SCANNER_COMPLETE",m
          assert m["item_count"]>0,m
          glbs=list(pathlib.Path("scanner_output").rglob("*.glb"))
          assert len(glbs)>0
          print("SCANNER_QA_OK",m["item_count"],"items",len(glbs),"proxy GLBs")
          PY

      - name: Prepare GPU-quality queue contracts
        run: |
          python3 maps/candyland_dream/scanner/gpu_backend_dispatch.py scanner_output --backend trellis
          python3 maps/candyland_dream/scanner/gpu_backend_dispatch.py scanner_output --backend triposr

      - name: Import scanner assets into Blender and render QA gallery
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1600x1000x24" blender             --background scanner_input/world/candyland_dream_v03.blend             --python maps/candyland_dream/scanner/blender_ingest_scanner.py             -- scanner_output scanner_output/candyland_scanner_gallery.blend             2>&1 | tee scanner_output/blender_scanner.log
          test -s scanner_output/candyland_scanner_gallery.blend
          test -s scanner_output/scanner_proxy_gallery.png

      - name: Build scanner overview contact sheet
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          imgs=sorted(Path("scanner_output").glob("*/detections.jpg"))
          if not imgs: raise SystemExit("no detection previews")
          cell=(640,360); cols=2; rows=(len(imgs)+1)//2
          sheet=Image.new("RGB",(cell[0]*cols,(cell[1]+34)*rows),(24,18,32))
          d=ImageDraw.Draw(sheet)
          for i,p in enumerate(imgs):
              im=Image.open(p).convert("RGB"); im=ImageOps.fit(im,cell)
              x=(i%2)*cell[0]; y=(i//2)*(cell[1]+34)
              sheet.paste(im,(x,y)); d.text((x+10,y+cell[1]+9),p.parent.name,fill=(255,235,248))
          sheet.save("scanner_output/scanner_detection_overview.jpg",quality=90)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: candyland-v07-asset-scanner
          path: scanner_output/
          if-no-files-found: error
          retention-days: 14
